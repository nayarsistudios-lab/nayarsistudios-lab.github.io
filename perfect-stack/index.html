<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Perfect Stack — Legal</title>
<style>
  :root {
    --bg: #0a0b14;
    --card: #12142280;
    --text: #f4f7ff;
    --muted: #9aa8c7;
    --accent: #4dd8ff;
    --border: #2a2f4a;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f6f7fb;
      --card: #ffffffcc;
      --text: #12141f;
      --muted: #545d78;
      --accent: #0072b5;
      --border: #dde1ee;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0a0b14; --card: #12142280; --text: #f4f7ff;
    --muted: #9aa8c7; --accent: #4dd8ff; --border: #2a2f4a;
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
    line-height: 1.6;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }
  h1 {
    font-size: 28px;
    margin-bottom: 4px;
    background: linear-gradient(90deg, #4dd8ff, #b76dff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .updated { color: var(--muted); font-size: 14px; margin-bottom: 32px; }
  h2 {
    font-size: 19px;
    margin-top: 36px;
    margin-bottom: 10px;
    color: var(--accent);
  }
  p, li { color: var(--text); font-size: 15.5px; }
  ul { padding-left: 22px; }
  li { margin-bottom: 6px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 20px;
    margin: 18px 0;
  }
  .placeholder {
    color: #ffb454;
    font-weight: 600;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin: 14px 0;
    font-size: 14.5px;
  }
  th, td {
    text-align: left;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
  }
  th { color: var(--muted); font-weight: 600; }
  a { color: var(--accent); }
  footer { margin-top: 48px; color: var(--muted); font-size: 13px; }
  .overflow-x { overflow-x: auto; }
</style>
</head>
<body>
<div class="wrap">

  <h1>Perfect Stack</h1>
  <div class="updated">Nayprek Studios</div>
  <div class="card">
    <p><a href="privacy.html">Privacy Policy</a></p>
    <p><a href="terms.html">Terms of Use</a></p>
    <p><a href="delete-data.html">Delete Your Data</a></p>
  </div>
  <p>Questions? Contact nayprekstudios@gmail.com</p>
  <footer>© 2026 Nayprek Studios</footer>
</div>
</body>
</html>
